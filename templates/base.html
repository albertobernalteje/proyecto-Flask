<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Biblioteca{% endblock %} — Biblioteca Universal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header>
    <a href="{{ url_for('index') }}">📚 Biblioteca Universal</a>
    <nav>
      <a href="{{ url_for('index') }}">Inicio</a>
      <a href="{{ url_for('libros') }}">Catálogo</a>
    </nav>
  </header>

  <main>
    {% block contenido %}{% endblock %}
  </main>

  <footer>
    <p>Datos: <a href="https://github.com/benoitvallon/100-best-books" target="_blank">github.com/benoitvallon/100-best-books</a>
    — Modificaciones añadidas: id, genre, rating</p>
  </footer>

</body>
</html>
